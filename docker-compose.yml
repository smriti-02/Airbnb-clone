version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/airbnb_clone.db:/app/airbnb_clone.db
      - ./backend/uploads:/app/uploads
    environment:
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=sqlite:///./airbnb_clone.db
      - JWT_SECRET=change_me_to_a_secure_random_string_in_production
